name: Update SKAsia EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build merged XMLTV files
        run: python scripts/build_epg.py

      - name: Show generated files
        run: |
          ls -lh output/
          cat output/build-status.txt

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Update SKAsia EPG"
            git push
          fi
